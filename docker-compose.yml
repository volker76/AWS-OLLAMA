  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    command: >
      --model meta-llama/Llama-3.1-8B-Instruct
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size 1
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    networks:
      - ai-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    ports:
      - "80:8080"
    environment:
      - OPENAI_API_BASE_URL=http://vllm:8000/v1
      - OPENAI_API_KEY=dummy-key
      - WEBUI_AUTH=false
    volumes:
      - openwebui-data:/app/backend/data
    networks:
      - ai-network
    restart: unless-stopped
    depends_on:
      - vllm
volumes:
  open-webui-data:
  caddy_data:
  caddy_config:
  
networks:
  ai-network:
    driver: bridge
