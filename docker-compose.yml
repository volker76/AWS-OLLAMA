services:
  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "443:443"   # Ollama API

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/ssl:/etc/caddy/ssl:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ai-network
    depends_on:
      - ollama
